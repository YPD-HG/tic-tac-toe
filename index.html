<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Inter' rel='stylesheet'>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/box.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <title>Tic Tac Toe</title>
</head>

<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <main>
        <div class="container">
            <div id="player_0">
                <!-- <h3>Player 0 <i class="fa-solid fa-arrow-right fa-1x"></i> </h3><i class="fa-solid fa-xmark fa-3x"></i> -->
            </div>
            <div class="board">
                <button>
                    <div class="sqr" id="sqr_00"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_01"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_02"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_10"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_11"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_12"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_20"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_21"></div>
                </button>
                <button>
                    <div class="sqr" id="sqr_22"></div>
                </button>
            </div>
            <div id="player_1">
                <!-- <h3>Player 1 <i class="fa-solid fa-arrow-right fa-1x"></i></h3> <i class="fa-solid fa-o fa-3x"></i> -->
            </div>
        </div>
    </main>
    <div>
        <h3></h3>
    </div>
    <div class="newGame"><button onclick="restartButton()">New Game</button></div>
    <script src="script.js"></script>
</body>

</html>
